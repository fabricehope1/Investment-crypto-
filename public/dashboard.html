<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>

  <style>
    body {
      background: #0b0e11;
      color: white;
      font-family: Arial;
      text-align: center;
      padding-top: 50px;
    }

    .card {
      background: #1e2329;
      padding: 20px;
      width: 300px;
      margin: auto;
      border-radius: 10px;
    }

    button {
      padding: 10px;
      background: red;
      border: none;
      color: white;
      border-radius: 5px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>Dashboard</h2>

  <p>Email: <span id="email"></span></p>
  <p>Balance: $<span id="balance"></span></p>

  <button onclick="logout()">Logout</button>
</div>

<script>
let user = JSON.parse(localStorage.getItem("user"));

if (!user) {
  window.location.href = "index.html";
}

document.getElementById("email").innerText = user.email;
document.getElementById("balance").innerText = user.balance || 0;

function logout() {
  localStorage.removeItem("user");
  window.location.href = "index.html";
}
</script>

</body>
</html>
