<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crypto Invest</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b0f1a;
  color:white;
}

.header {
  background:#12182b;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

.container {
  padding:15px;
}

.card {
  background:#12182b;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}

input {
  width:100%;
  padding:12px;
  margin:5px 0;
  border:none;
  border-radius:5px;
}

button {
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:5px;
  background:#00c896;
  color:white;
  font-weight:bold;
}

.balance {
  font-size:24px;
  text-align:center;
}

.plan {
  display:flex;
  justify-content:space-between;
  align-items:center;
}
</style>
</head>

<body>

<div class="header">Crypto Investment</div>

<div class="container">

<!-- LOGIN -->
<div id="auth" class="card">
<h3>Login / Register</h3>
<input id="u" placeholder="Username">
<input id="p" type="password" placeholder="Password">
<button onclick="register()">Register</button>
<button onclick="login()">Login</button>
</div>

<!-- DASHBOARD -->
<div id="dash" style="display:none">

<div class="card">
<div class="balance" id="bal">$0</div>
</div>

<div class="card">
<h3>Deposit</h3>
<p>Wallet:</p>
<small>0xA7123932DF237A24ad8c251502C169d744dd6D41</small>
</div>

<div class="card">
<h3>Plans</h3>

<div class="plan">
<span>$10 → $2/day</span>
<button onclick="invest(10)">Invest</button>
</div>

<br>

<div class="plan">
<span>$50 → $10/day</span>
<button onclick="invest(50)">Invest</button>
</div>

</div>

<div class="card">
<h3>Referral</h3>
<input id="ref" readonly>
</div>

<button onclick="logout()">Logout</button>

</div>

</div>

<script>

async function register(){
 await fetch("/register",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body: JSON.stringify({
    username:u.value,
    password:p.value,
    ref:new URLSearchParams(location.search).get("ref")
  })
 });
 alert("Registered");
}

async function login(){
 let res = await fetch("/login",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body: JSON.stringify({
    username:u.value,
    password:p.value
  })
 });

 let data = await res.json();

 auth.style.display="none";
 dash.style.display="block";

 bal.innerText="$"+data.balance;
 ref.value=location.href+"?ref="+u.value;
}

async function invest(amount){
 await fetch("/invest",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body: JSON.stringify({
    username:u.value,
    amount:amount
  })
 });

 alert("Invested!");
}

function logout(){
 location.reload();
}

</script>

</body>
  </html>
