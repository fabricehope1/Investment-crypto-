<!DOCTYPE html>
<html>
<head>
  <title>Crypto Investment</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <style>
    body {
      background: #0b0e11;
      color: white;
      font-family: Arial;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background: #1e2329;
      padding: 30px;
      border-radius: 10px;
      width: 300px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: none;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #f0b90b;
      border: none;
      border-radius: 5px;
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Crypto Investment</h2>

  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">

  <button onclick="login()">Login</button>
  <button onclick="register()">Register</button>

  <p id="msg"></p>
</div>

<script>
const supabase = window.supabase.createClient(
  "https://mzconpuykzsysdbykdlr.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im16Y29ucHV5a3pzeXNkYnlrZGxyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2ODIzNzYsImV4cCI6MjA5MzI1ODM3Nn0.bTBcUf7cQS6FGQN_hpTWYlEweWhtkW4rSyItbQtx234"
);

// REGISTER
async function register() {
  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;

  const { error } = await supabase.from("user").insert([
    { email: email, password: password, balance: 0 }
  ]);

  if (error) {
    document.getElementById("msg").innerText = error.message;
  } else {
    document.getElementById("msg").innerText = "Account created!";
  }
}

// LOGIN
async function login() {
  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;

  const { data, error } = await supabase
    .from("user")
    .select("*")
    .eq("email", email)
    .eq("password", password)
    .single();

  if (error || !data) {
    document.getElementById("msg").innerText = "Invalid login";
  } else {
    localStorage.setItem("user", JSON.stringify(data));
    window.location.href = "/dashboard.html";
  }
}
</script>

</body>
</html>
